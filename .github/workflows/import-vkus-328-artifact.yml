name: Verify Vkus 3.28 artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Q328
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify recovered build and launch evidence
        run: |
          set -euo pipefail
          cd recovered-builds/3.28
          test -s Vkus_3.28_NO_SPLASH.zip
          test -s Vkus_3.28_LAUNCH.png
          test -s SHA256SUMS.txt
          expected="$(awk '{print $1}' SHA256SUMS.txt)"
          actual="$(sha256sum Vkus_3.28_NO_SPLASH.zip | awk '{print $1}')"
          test "$expected" = "$actual"
          file Vkus_3.28_NO_SPLASH.zip Vkus_3.28_LAUNCH.png
          sha256sum Vkus_3.28_NO_SPLASH.zip Vkus_3.28_LAUNCH.png
