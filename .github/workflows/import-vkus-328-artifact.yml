name: Import Vkus 3.28 artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-vkus-328-artifact.yml'

permissions:
  contents: write

jobs:
  import-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Q328
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download original public Actions artifact
        run: |
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/tailsparrot1-mind/vkus--3.17-button/actions/artifacts/14124759940/zip" \
            --output /tmp/vkus-328-artifact.zip
          mkdir -p /tmp/vkus-328-artifact
          unzip -q /tmp/vkus-328-artifact.zip -d /tmp/vkus-328-artifact

      - name: Verify and stage build evidence
        run: |
          test -s /tmp/vkus-328-artifact/Vkus_3.28_NO_SPLASH.zip
          test -s /tmp/vkus-328-artifact/Vkus_3.28_LAUNCH.png
          test -s /tmp/vkus-328-artifact/SHA256SUMS.txt
          mkdir -p recovered-builds/3.28
          cp /tmp/vkus-328-artifact/Vkus_3.28_NO_SPLASH.zip recovered-builds/3.28/
          cp /tmp/vkus-328-artifact/Vkus_3.28_LAUNCH.png recovered-builds/3.28/
          cp /tmp/vkus-328-artifact/SHA256SUMS.txt recovered-builds/3.28/
          printf 'Imported from workflow run 43623882237 / artifact 14124759940.\n' > recovered-builds/3.28/ARTIFACT_SOURCE.txt
          expected="$(awk '{print $1}' /tmp/vkus-328-artifact/SHA256SUMS.txt)"
          printf '%s  %s\n' "$expected" "recovered-builds/3.28/Vkus_3.28_NO_SPLASH.zip" | sha256sum -c -

      - name: Commit evidence into Q328
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovered-builds/3.28
          if git diff --cached --quiet; then
            echo "No new artifact files to commit."
            exit 0
          fi
          git commit -m "Import verified Vkus 3.28 build and launch evidence"
          git push origin HEAD:main
