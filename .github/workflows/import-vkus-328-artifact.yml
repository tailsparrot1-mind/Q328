name: Import Vkus 3.28 artifact

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  import-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Q328
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download original Vkus 3.28 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/vkus-328-artifact
          gh run download 43623882237 \
            --repo tailsparrot1-mind/vkus--3.17-button \
            --name Vkus-3.28-build-and-launch-evidence \
            --dir /tmp/vkus-328-artifact

      - name: Verify and stage build evidence
        run: |
          test -s /tmp/vkus-328-artifact/Vkus_3.28_NO_SPLASH.zip
          test -s /tmp/vkus-328-artifact/Vkus_3.28_LAUNCH.png
          test -s /tmp/vkus-328-artifact/SHA256SUMS.txt
          mkdir -p recovered-builds/3.28
          cp /tmp/vkus-328-artifact/Vkus_3.28_NO_SPLASH.zip recovered-builds/3.28/
          cp /tmp/vkus-328-artifact/Vkus_3.28_LAUNCH.png recovered-builds/3.28/
          cp /tmp/vkus-328-artifact/SHA256SUMS.txt recovered-builds/3.28/
          printf '\nImported from workflow run 43623882237 / artifact 14124759940.\n' > recovered-builds/3.28/ARTIFACT_SOURCE.txt
          cd recovered-builds/3.28
          sha256sum -c SHA256SUMS.txt

      - name: Commit evidence into Q328
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovered-builds/3.28
          if git diff --cached --quiet; then
            echo "No new artifact files to commit."
            exit 0
          fi
          git commit -m "Import verified Vkus 3.28 build and launch evidence"
          git push origin HEAD:main
