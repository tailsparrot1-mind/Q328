name: Vkus 3.28 Marketplace Candidate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/build_vkus_328_marketplace.py'
      - '.github/workflows/build-vkus-328-marketplace.yml'
  push:
    branches: [feature/vkus-328-marketplace-board]
    paths:
      - 'tools/build_vkus_328_marketplace.py'
      - '.github/workflows/build-vkus-328-marketplace.yml'
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build isolated candidate from original 3.28 archive
        run: python tools/build_vkus_328_marketplace.py
      - name: Install test/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          python -m pip install --upgrade pip
          python -m pip install Pillow selenium keyring
      - name: Compile all Python modules
        run: |
          mkdir -p /tmp/vkus-candidate
          unzip -q artifacts/Vkus_3.28_Marketplace_Candidate.zip -d /tmp/vkus-candidate
          python -m compileall -q /tmp/vkus-candidate
      - name: Run cloud marketplace unit tests (network mocked)
        run: |
          cd /tmp/vkus-candidate
          python -m unittest tests/test_cloud_marketplace.py -v
      - name: Launch Vkus and capture real UI screenshots under Xvfb
        run: |
          cd /tmp/vkus-candidate
          mkdir -p screenshots
          xvfb-run -a python - <<'PY'
          import time
          import tkinter as tk
          from PIL import ImageGrab
          from vkus.app import VkusApp
          from vkus.exchange_visual import install_exchange_visuals
          import vkus.cloud_marketplace as cloud
          from types import SimpleNamespace

          class FakeClient:
              def __init__(self, role=None, rows=None):
                  self.is_authenticated = bool(role)
                  self.session = (SimpleNamespace(user={
                      "email": "demo@vkus.local",
                      "user_metadata": {"marketplace_role": role}
                  }) if role else None)
                  self.session_persistence_available = True
                  self.rows = rows or []
              def list_listings(self, **kwargs):
                  return self.rows

          cloud.SupabaseMarketplaceClient = lambda: FakeClient()
          install_exchange_visuals()
          app = VkusApp()
          app._unlock()
          app.root.update()
          app._show_exchange()
          app.root.update()
          time.sleep(1)
          ImageGrab.grab().save("screenshots/Vkus_3.28_Birzha.png")
          def click_board_button():
              scale, ox, oy, _rw, _rh = app.exchange_geometry
              click_x = int(ox + (1210 - 8) * scale)
              click_y = int(oy + (400 - 8) * scale)
              app.exchange_canvas.event_generate("<Button-1>", x=click_x, y=click_y)
              app.root.update()
              windows = [w for w in app.root.winfo_children()
                         if isinstance(w, tk.Toplevel) and w.winfo_exists()]
              assert windows, "Birzha board button did not open the noticeboard window"
              return windows[-1]
          board = click_board_button()
          time.sleep(1)
          ImageGrab.grab().save("screenshots/Vkus_3.28_Marketplace_Role_Gate.png")
          board.destroy()
          app.root.update()
          cloud.SupabaseMarketplaceClient = lambda: FakeClient("Соискатель", [])
          board = click_board_button()
          time.sleep(1)
          ImageGrab.grab().save("screenshots/Vkus_3.28_Marketplace_Empty.png")
          board.destroy()
          app.root.update()
          demo_rows = [{
              "id": "demo-card-1", "kind": "Ищу", "category": "Услуги",
              "title": "ДЕМО · Ищу мастера по ремонту ноутбука",
              "description": "Демонстрационная карточка интерфейса. Это не опубликованное объявление.",
              "city": "Орск", "price": "1500", "currency": "RUB",
              "created_at": "2026-11-15T18:00:00", "owner_id": "demo",
              "contact": ""
          }]
          cloud.SupabaseMarketplaceClient = lambda: FakeClient("Соискатель", demo_rows)
          board = click_board_button()
          time.sleep(1)
          ImageGrab.grab().save("screenshots/Vkus_3.28_Marketplace_Card_DEMO.png")
          board.destroy()
          app.root.destroy()
          PY
      - name: Validate candidate archive and checksum
        run: |
          unzip -t artifacts/Vkus_3.28_Marketplace_Candidate.zip
          cd artifacts
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Vkus-3.28-Marketplace-Candidate
          path: |
            artifacts/Vkus_3.28_Marketplace_Candidate.zip
            artifacts/SHA256SUMS.txt
            artifacts/BUILD_NOTES.md
            /tmp/vkus-candidate/screenshots/*.png
